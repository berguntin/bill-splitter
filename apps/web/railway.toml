# Railway service "web". In the service settings, keep Root Directory empty
# (the whole monorepo is needed) and set the config file to /apps/web/railway.toml.

[build]
# Railpack installs dependencies first; the root build script reads SERVICE
# and builds only this app (see scripts/build-service.mjs).
buildCommand = "pnpm run build"
watchPatterns = ["apps/web/**", "packages/core/**", "pnpm-lock.yaml", "package.json", "scripts/**"]

[deploy]
startCommand = "pnpm run start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
