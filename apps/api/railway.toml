# Railway service "api". In the service settings, keep Root Directory empty
# (the whole monorepo is needed) and set the config file to /apps/api/railway.toml.

[build]
# Installs only this service and its workspace dependencies (`...`), and skips
# type checking, which CI already runs. --prod=false keeps dev dependencies
# (tsup) even if NODE_ENV=production.
buildCommand = "pnpm install --frozen-lockfile --prod=false --filter @bill-splitter/api... && pnpm --filter @bill-splitter/api exec tsup"
watchPatterns = ["apps/api/**", "packages/core/**", "pnpm-lock.yaml"]

[deploy]
startCommand = "pnpm --filter @bill-splitter/api start"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
