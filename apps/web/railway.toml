# Railway service "web". In the service settings, keep Root Directory empty
# (the whole monorepo is needed) and set the config file to /apps/web/railway.toml.

[build]
# Installs only this service and its workspace dependencies (`...`), and skips
# type checking, which CI already runs. --prod=false keeps dev dependencies
# (Vite) even if NODE_ENV=production.
buildCommand = "pnpm install --frozen-lockfile --prod=false --filter @bill-splitter/web... && pnpm --filter @bill-splitter/web exec vite build"
watchPatterns = ["apps/web/**", "packages/core/**", "pnpm-lock.yaml"]

[deploy]
startCommand = "pnpm --filter @bill-splitter/web start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
